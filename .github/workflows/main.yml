name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" https://settlo.streamlit.app/)
          echo "Status: $STATUS"
